# Deploys the static marketing landing page (public/landing.html) to GitHub Pages.
# This is a STAGING MIRROR of the production site at https://jmarie.beauty
name: Deploy Landing Page to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site
        # Publish public/ (landing + privacy + terms + images) with landing.html
        # as the index. Rewrite absolute legal links to relative so they resolve
        # under the project Pages subpath (/Marie-AI/).
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp public/landing.html _site/index.html
          sed -i 's#href="/privacy.html"#href="privacy.html"#g; s#href="/terms.html"#href="terms.html"#g' _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
