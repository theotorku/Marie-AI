name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'public/landing.html'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only run one Pages deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        # Publish the static marketing site (public/) with landing.html as the
        # index. Ship privacy/terms + brand images so footer links and assets
        # resolve. Rewrite absolute legal links to relative so they work under
        # the project Pages subpath (e.g. /Marie-AI/).
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp public/landing.html _site/index.html
          sed -i 's#href="/privacy.html"#href="privacy.html"#g; s#href="/terms.html"#href="terms.html"#g' _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
